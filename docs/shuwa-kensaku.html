<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>手話検索</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手話検索">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f3ee">
<link rel="apple-touch-icon" href="shuwa-kensaku-icon.png">
<style>
  :root {
    --paper: #f6f3ee;
    --ink: #2b2620;
    --thread: #b3543a;
    --line: #d9d2c4;
    --muted: #8a8375;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    padding: 48px 20px 80px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 28px;
    text-align: center;
  }
  .search-row { display: flex; gap: 10px; }
  input[type="text"] {
    flex: 1;
    font-size: 17px;
    padding: 14px 18px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: #fff;
    outline: none;
    color: var(--ink);
  }
  input[type="text"]:focus { border-color: var(--thread); }
  button {
    font-size: 14px;
    padding: 0 22px;
    border-radius: 999px;
    border: none;
    background: var(--thread);
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:active { transform: scale(0.97); }
  .status { font-size: 13px; color: var(--muted); margin: 16px 4px; min-height: 18px; }

  .links { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .link-btn {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    text-decoration: none;
    color: inherit;
    display: block;
    font-size: 14px;
    font-weight: 600;
  }
  .link-btn:hover { border-color: var(--thread); }
  .link-btn .sub { font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>手話検索</h1>
  <div class="search-row">
    <input type="text" id="q" placeholder="単語を入力" autocomplete="off" autofocus>
    <button id="go">検索</button>
  </div>
  <p class="status" id="status"></p>
  <div class="links" id="links"></div>
</div>

<script>
  const qEl = document.getElementById('q');
  const statusEl = document.getElementById('status');
  const linksEl = document.getElementById('links');

  function makeLink(label, sub, url) {
    const a = document.createElement('a');
    a.className = 'link-btn';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = label;
    const subEl = document.createElement('div');
    subEl.className = 'sub';
    subEl.textContent = sub;
    a.appendChild(subEl);
    return a;
  }

  function search() {
    const word = qEl.value.trim();
    if (!word) return;

    const query = word + ' 手話';
    linksEl.innerHTML = '';
    statusEl.textContent = '';

    const imageSearchUrl = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(query);

    linksEl.appendChild(makeLink(
      'Google画像検索を開く',
      query,
      imageSearchUrl
    ));
    linksEl.appendChild(makeLink(
      'Google検索を開く',
      query,
      'https://www.google.com/search?q=' + encodeURIComponent(query)
    ));
    linksEl.appendChild(makeLink(
      'YouTubeで動画を探す',
      query,
      'https://www.youtube.com/results?search_query=' + encodeURIComponent(query)
    ));

    window.open(imageSearchUrl, '_blank', 'noopener');
  }

  document.getElementById('go').addEventListener('click', search);
  qEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') search();
  });
</script>
</body>
</html>
